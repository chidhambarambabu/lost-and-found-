<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Lost & Found DApp</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-body">
<div class="auth-wrapper" style="max-width:500px;display:block;">
    <div class="auth-card">
        <div style="text-align:center;margin-bottom:1.5rem">
            <div style="font-size:2.5rem">🔍</div>
            <h2 style="margin-top:0.5rem">Create Account</h2>
            <p class="auth-sub">Register on the blockchain</p>
        </div>

        <div id="msg" class="alert" style="display:none"></div>

        <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="Enter your full name">
        </div>
        <div class="form-group">
            <label class="form-label">Mobile Number</label>
            <input type="tel" id="mobile" class="form-control" placeholder="Enter mobile number">
        </div>

        <div class="wallet-connect-box" id="wallet-box" style="margin-bottom:1rem">
            <div class="wallet-icon">🦊</div>
            <p>Connect MetaMask wallet to register</p>
            <button class="btn btn-outline btn-block" onclick="connectWalletForReg()">Connect MetaMask</button>
        </div>
        <div id="wallet-info" style="display:none" class="alert alert-success" style="margin-bottom:1rem">
            Wallet: <strong id="w-addr"></strong>
        </div>

        <button class="btn btn-primary btn-block btn-lg" onclick="registerUser()" id="reg-btn">
            <span id="reg-text">Register on Blockchain</span>
            <span id="reg-spinner" class="spinner" style="display:none"></span>
        </button>
        <div class="auth-footer" style="margin-top:1rem">
            Already registered? <a href="login.html">Login here</a>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.10.0/web3.min.js"></script>
<script src="js/blockchain.js"></script>
<script src="js/register.js"></script>
</body>
</html>
