<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Detail — Lost & Found DApp</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" href="dashboard.html">🔍 Lost &amp; <span>Found</span></a>
    <div class="navbar-nav">
        <a href="search.html">Search Items</a>
        <a href="post-item.html">Post Item</a>
        <a href="my-posts.html">My Posts</a>
        <a href="my-claims.html">My Claims</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="logout()">Logout</a>
        <span class="wallet-badge" id="wallet-display">🦊 ...</span>
    </div>
</nav>

<div class="container" style="padding-top:2rem;padding-bottom:3rem">
    <a href="search.html" class="btn btn-outline btn-sm" style="margin-bottom:1.5rem">← Back to Search</a>
    
    <div id="item-detail">
        <div style="color:var(--text-muted)">Loading item from blockchain...</div>
    </div>

    <!-- Claim Modal -->
    <div id="claim-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:200;display:none;align-items:center;justify-content:center">
        <div class="card" style="max-width:480px;width:90%;max-height:90vh;overflow-y:auto">
            <h3 style="margin-bottom:1.25rem">📩 Submit Claim Request</h3>
            <div id="claim-msg" class="alert" style="display:none"></div>
            <div class="form-group">
                <label class="form-label">Your Name</label>
                <input type="text" id="claim-name" class="form-control" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label class="form-label">Mobile Number</label>
                <input type="tel" id="claim-mobile" class="form-control" placeholder="Enter your mobile">
            </div>
            <div class="form-group">
                <label class="form-label">Proof Image <span style="color:var(--danger)">*</span></label>
                <input type="file" id="claim-proof" class="form-control" accept="image/*">
                <div class="form-hint">Upload a photo that proves ownership (receipt, photo with item, etc.)</div>
            </div>
            <div style="display:flex;gap:0.75rem;margin-top:1.25rem">
                <button class="btn btn-primary" onclick="submitClaim()" id="claim-submit-btn">Submit Claim</button>
                <button class="btn btn-outline" onclick="closeClaimModal()">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.10.0/web3.min.js"></script>
<script src="../js/blockchain.js"></script>
<script src="../js/item-detail.js"></script>
</body>
</html>
