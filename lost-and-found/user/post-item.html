<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Item — Lost & Found DApp</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" href="dashboard.html">🔍 Lost &amp; <span>Found</span></a>
    <div class="navbar-nav">
        <a href="search.html">Search Items</a>
        <a href="post-item.html" class="active">Post Item</a>
        <a href="my-posts.html">My Posts</a>
        <a href="my-claims.html">My Claims</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="logout()">Logout</a>
        <span class="wallet-badge" id="wallet-display">🦊 ...</span>
    </div>
</nav>

<div class="page-header">
    <h1 id="page-title">➕ Post Lost / Found Item</h1>
    <p>Your item details will be stored on the blockchain</p>
</div>

<div class="container page-body">
    <div class="card" style="max-width:680px;margin:0 auto">
        <div id="msg" class="alert" style="display:none"></div>

        <!-- Item Type -->
        <div class="form-group">
            <label class="form-label">Item Type <span style="color:var(--danger)">*</span></label>
            <div style="display:flex;gap:1rem">
                <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-weight:600">
                    <input type="radio" name="item-type" value="lost" checked onchange="setType('lost')"> 
                    <span class="badge badge-lost" style="padding:0.4rem 1rem">Lost Item</span>
                </label>
                <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-weight:600">
                    <input type="radio" name="item-type" value="found" onchange="setType('found')"> 
                    <span class="badge badge-found" style="padding:0.4rem 1rem">Found Item</span>
                </label>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Item Name <span style="color:var(--danger)">*</span></label>
                <input type="text" id="item-name" class="form-control" placeholder="e.g. Black iPhone 14, Blue Wallet">
            </div>
            <div class="form-group">
                <label class="form-label">Category <span style="color:var(--danger)">*</span></label>
                <select id="item-category" class="form-control">
                    <option value="">-- Select Category --</option>
                    <option>Electronics</option>
                    <option>Wallet/Purse</option>
                    <option>Keys</option>
                    <option>Documents/ID</option>
                    <option>Jewelry</option>
                    <option>Clothing</option>
                    <option>Bag/Backpack</option>
                    <option>Books/Stationery</option>
                    <option>Vehicle</option>
                    <option>Pet</option>
                    <option>Other</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Description <span style="color:var(--danger)">*</span></label>
            <textarea id="item-desc" class="form-control" placeholder="Describe the item in detail — color, brand, special marks, etc."></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Location <span style="color:var(--danger)">*</span></label>
                <input type="text" id="item-location" class="form-control" placeholder="e.g. Central Park, NY">
            </div>
            <div class="form-group">
                <label class="form-label">Date Lost/Found <span style="color:var(--danger)">*</span></label>
                <input type="date" id="item-date" class="form-control">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Your Name <span style="color:var(--danger)">*</span></label>
                <input type="text" id="person-name" class="form-control" placeholder="Contact person name">
            </div>
            <div class="form-group">
                <label class="form-label">Mobile Number <span style="color:var(--danger)">*</span></label>
                <input type="tel" id="person-mobile" class="form-control" placeholder="Contact mobile">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Item Image</label>
            <input type="file" id="item-image" class="form-control" accept="image/*" onchange="previewImage(this)">
            <div class="form-hint">📁 Image is stored in XAMPP server (not on blockchain). Max 5MB.</div>
            <img id="img-preview" style="display:none;margin-top:0.75rem;max-height:200px;border-radius:var(--radius-sm);border:1px solid var(--border)">
        </div>

        <div style="display:flex;gap:0.75rem;margin-top:0.5rem">
            <button class="btn btn-primary btn-lg" onclick="postItem()" id="post-btn">
                <span id="post-text">Post on Blockchain</span>
                <span id="post-spinner" class="spinner" style="display:none"></span>
            </button>
            <a href="my-posts.html" class="btn btn-outline">Cancel</a>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.10.0/web3.min.js"></script>
<script src="../js/blockchain.js"></script>
<script src="../js/post-item.js"></script>
</body>
</html>
