<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback — Lost & Found DApp</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" href="dashboard.html">🔍 Lost &amp; <span>Found</span></a>
    <div class="navbar-nav">
        <a href="search.html">Search Items</a>
        <a href="post-item.html">Post Item</a>
        <a href="my-posts.html">My Posts</a>
        <a href="my-claims.html">My Claims</a>
        <a href="feedback.html" class="active">Feedback</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="logout()">Logout</a>
        <span class="wallet-badge" id="wallet-display">🦊 ...</span>
    </div>
</nav>

<div class="page-header"><h1>💬 Feedback</h1><p>Share your experience with the platform</p></div>

<div class="container page-body" style="max-width:680px">
    <div class="card" style="margin-bottom:2rem">
        <h3 style="margin-bottom:1.25rem">Post Your Feedback</h3>
        <div id="fb-msg" class="alert" style="display:none"></div>
        <div class="form-group">
            <label class="form-label">Rating</label>
            <div id="star-rating" style="display:flex;gap:0.5rem;font-size:2rem;cursor:pointer">
                <span onclick="setRating(1)" data-r="1">☆</span>
                <span onclick="setRating(2)" data-r="2">☆</span>
                <span onclick="setRating(3)" data-r="3">☆</span>
                <span onclick="setRating(4)" data-r="4">☆</span>
                <span onclick="setRating(5)" data-r="5">☆</span>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Message</label>
            <textarea id="fb-message" class="form-control" rows="4" placeholder="Share your experience..."></textarea>
        </div>
        <button class="btn btn-primary" onclick="submitFeedback()">Submit Feedback on Blockchain</button>
    </div>

    <div class="card">
        <h3 style="margin-bottom:1rem">All Feedback</h3>
        <div id="feedback-list"><div style="color:var(--text-muted)">Loading...</div></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.10.0/web3.min.js"></script>
<script src="../js/blockchain.js"></script>
<script src="../js/feedback.js"></script>
</body>
</html>
