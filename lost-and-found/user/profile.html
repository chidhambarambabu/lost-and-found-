<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — Lost & Found DApp</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" href="dashboard.html">🔍 Lost &amp; <span>Found</span></a>
    <div class="navbar-nav">
        <a href="search.html">Search Items</a>
        <a href="post-item.html">Post Item</a>
        <a href="my-posts.html">My Posts</a>
        <a href="my-claims.html">My Claims</a>
        <a href="profile.html" class="active">Profile</a>
        <a href="#" onclick="logout()">Logout</a>
        <span class="wallet-badge" id="wallet-display">🦊 ...</span>
    </div>
</nav>

<div class="page-header">
    <h1>👤 My Profile</h1>
    <p>Manage your account details</p>
</div>

<div class="container page-body">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;max-width:820px;margin:0 auto">
        <!-- Update Profile -->
        <div class="card">
            <h3 style="margin-bottom:1.25rem">Update Profile</h3>
            <div id="profile-msg" class="alert" style="display:none"></div>
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="profile-name" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Mobile Number</label>
                <input type="tel" id="profile-mobile" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Wallet Address</label>
                <input type="text" id="profile-wallet" class="form-control" readonly style="background:#f5f5f5;font-family:monospace;font-size:0.8rem">
            </div>
            <button class="btn btn-primary" onclick="updateProfile()">Update Profile on Blockchain</button>
        </div>

        <!-- Change Password (XAMPP PHP) -->
        <div class="card">
            <h3 style="margin-bottom:1.25rem">Change Password</h3>
            <p style="color:var(--text-muted);font-size:0.88rem;margin-bottom:1rem">Note: This app uses MetaMask for auth. Password is for the off-chain user record.</p>
            <div id="pwd-msg" class="alert" style="display:none"></div>
            <div class="form-group">
                <label class="form-label">Current Password</label>
                <input type="password" id="curr-pwd" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" id="new-pwd" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" id="confirm-pwd" class="form-control">
            </div>
            <button class="btn btn-primary" onclick="changePassword()">Change Password</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.10.0/web3.min.js"></script>
<script src="../js/blockchain.js"></script>
<script src="../js/profile.js"></script>
</body>
</html>
